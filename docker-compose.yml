version: '3.8'

services:
  bot:
    build: .
    container_name: sova-bot
    environment:
      - NODE_ENV=production
      - WEBHOOK_PORT=${WEBHOOK_PORT:-3000}
      - PRIVATE_TURSO_DATABASE_URL=${PRIVATE_TURSO_DATABASE_URL}
      - PRIVATE_TURSO_AUTH_TOKEN=${PRIVATE_TURSO_AUTH_TOKEN}
      # Add your environment variables here or use an .env file
      - VOTE_AUTH=${VOTE_AUTH}
      - BOT_TOKEN=${BOT_TOKEN}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    # Run database migrations before starting the bot
    command: sh -c "bun start:bot"
